# Builds hudlight.exe and publishes it as a GitHub release when a version tag is pushed.
# Installed copies of HudLight pick the release up automatically (see src/update.rs).
#
#   1. Bump `version` in Cargo.toml, commit.
#   2. git tag v0.2.0 && git push origin main v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version"
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/hudlight.exe hudlight.exe
          $hash = (Get-FileHash hudlight.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  hudlight.exe" | Out-File -Encoding ascii -NoNewline hudlight.exe.sha256

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" hudlight.exe hudlight.exe.sha256 --title "HudLight ${{ github.ref_name }}" --generate-notes
